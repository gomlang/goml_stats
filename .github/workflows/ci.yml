name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@d820cfef8ca0adcc6a75f41c2066f44063713bd9
    with:
      module: goml_stats
      verification-ref: d820cfef8ca0adcc6a75f41c2066f44063713bd9
